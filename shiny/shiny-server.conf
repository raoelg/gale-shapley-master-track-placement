run_as shiny;
# Stop an app's R process 30 minutes after its last connection closes;
# a new visit starts it again (like shinyapps.io sleep/wake).
app_idle_timeout 1800;
server {
  listen 3838;
  location /mastertrack {
    app_dir /srv/shiny-server/mastertrack;
    log_dir /var/log/shiny-server;
    app_init_timeout 120;
    # at most 3 simultaneous sessions; further visitors get a "busy" page
    simple_scheduler 3;
  }
}
